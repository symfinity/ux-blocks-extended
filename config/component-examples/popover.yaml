role: popover
twig_name: Popover
groups:
  - id: examples
    section: Examples
    layout: stack
    items:
      - id: default
        label: "Anchored panel"
        props: {}
        slot_twig: |
          <twig:Popover>
              <twig:Popover:Trigger>{{ lorem_words(1)|capitalize }}</twig:Popover:Trigger>
              <twig:Popover:Content>{{ lorem_sentence() }}</twig:Popover:Content>
          </twig:Popover>
