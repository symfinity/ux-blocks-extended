role: popover
twig_name: Popover
groups:
  - id: examples
    section: Examples
    layout: stack
    items:
      - id: default
        label: "Anchored panel"
        props:
          label: Account settings
          popoverId: handbook-popover-demo
        slot_twig: |
          <div>
              <button
                  type="button"
                  data-ui-role="button"
                  data-ui-variant="outline"
                  popovertarget="handbook-popover-demo"
              >
                  {{ lorem_words(1)|capitalize }}
              </button>
              <twig:Popover popoverId="handbook-popover-demo" label="Account settings">
                  {% block content %}
                      <p>{{ lorem_sentence() }}</p>
                  {% endblock %}
              </twig:Popover>
          </div>
