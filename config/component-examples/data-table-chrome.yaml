role: data-table-chrome
twig_name: DataTableChrome
groups:
  - id: examples
    section: Examples
    layout: stack
    items:
      - id: default
        label: "Table toolbar"
        props: {}
        slot_twig: |
          <twig:DataTableChrome title="{{ lorem_title() }}" description="{{ lorem_sentence() }}">
              <twig:Button variant="primary" appearance="outline" size="sm">{{ lorem_words(1)|capitalize }}</twig:Button>
          </twig:DataTableChrome>
