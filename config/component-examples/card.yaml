role: card
twig_name: Card
groups:
  - id: examples
    section: Examples
    layout: stack
    items:
      - id: basic
        label: "Basic card"
        props: {}
        slot_twig: |
          <twig:Card title="{{ lorem_title() }}" description="{{ lorem_sentence() }}">
              {% block content %}<p>{{ lorem_sentence() }}</p>{% endblock %}
              {% block footer %}<twig:Button variant="primary" size="sm">{{ lorem_words(1)|capitalize }}</twig:Button>{% endblock %}
          </twig:Card>
      - id: compact
        label: "Compact density"
        props: {}
        slot_twig: |
          <twig:Card title="{{ lorem_title() }}" description="{{ lorem_sentence() }}">
              {% block content %}<p>{{ lorem_sentence() }}</p>{% endblock %}
              {% block footer %}<twig:Button variant="primary" size="sm">{{ lorem_words(1)|capitalize }}</twig:Button>{% endblock %}
          </twig:Card>
