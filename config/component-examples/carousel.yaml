role: carousel
twig_name: Carousel
groups:
  - id: examples
    section: Examples
    layout: stack
    items:
      - id: default
        label: Slides
        props: {}
        slot_twig: |
          <twig:Carousel>
              {% block content %}
                  <div data-ui-role="card" style="min-width: 14rem; padding: var(--ui-space-md);">
                      <strong>{{ lorem_words(2)|capitalize }}</strong>
                      <p>{{ lorem_sentence() }}</p>
                  </div>
                  <div data-ui-role="card" style="min-width: 14rem; padding: var(--ui-space-md);">
                      <strong>{{ lorem_words(2)|capitalize }}</strong>
                      <p>{{ lorem_sentence() }}</p>
                  </div>
              {% endblock %}
          </twig:Carousel>
