role: page-header
twig_name: PageHeader
groups:
  - id: examples
    section: Examples
    layout: stack
    items:
      - id: basic
        label: "Title and description"
        props: {}
        slot_twig: |
          <twig:PageHeader title="{{ lorem_title() }}" description="{{ lorem_sentence() }}">
              <twig:Button variant="primary">{{ lorem_words(1)|capitalize }}</twig:Button>
          </twig:PageHeader>
