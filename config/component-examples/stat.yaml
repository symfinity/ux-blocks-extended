role: stat
twig_name: Stat
groups:
  - id: examples
    section: Examples
    layout: stack
    items:
      - id: users
        label: Users
        props: {}
        slot_twig: |
          <twig:Stat>
              <span data-ui-role="stat-label">{{ lorem_words(1)|capitalize }}</span>
              <span data-ui-role="stat-value">1,204</span>
              <span data-ui-role="typography" data-ui-variant="muted">{{ lorem_sentence() }}</span>
          </twig:Stat>
      - id: revenue
        label: Revenue
        props: {}
        slot_twig: |
          <twig:Stat>
              <span data-ui-role="stat-label">{{ lorem_words(1)|capitalize }}</span>
              <span data-ui-role="stat-value">€12.4k</span>
              <span data-ui-role="typography" data-ui-variant="muted">{{ lorem_sentence() }}</span>
          </twig:Stat>
